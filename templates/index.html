<!DOCTYPE html>
<html lang="en">
<head>
    <!-- CHARSET MUST BE FIRST: the HTML spec requires the encoding
         declaration entirely within the first 1024 bytes, and the per-page
         meta block Dash prepends inside its placeholder grows with every
         description. Declaring it here pins it near byte 60. The duplicate
         charset Dash emits later is deliberate and harmless.

         NEVER NAME A DASH PLACEHOLDER INSIDE A COMMENT: Dash substitutes
         placeholders by plain string replacement over the whole template,
         comments included, and a named one duplicates its entire block on
         every response — invisible in a browser, fully visible to
         scrapers. -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <!-- Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-6WYY9JHMP2"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-6WYY9JHMP2');
    </script>

    <!-- Dash emits, per page, from register_page(): description, og:type,
         og:title, og:description, og:image and the full twitter set. Do NOT
         restate any of those below — a second, site-level copy is strictly
         worse than the page-level one, and which duplicate a scraper honours
         is undefined (in practice the later tag wins). The hardcoded title,
         og/twitter block, canonical and stale JSON-LD that used to live here
         were exactly that failure. -->
    {%metas%}
    <title>{%title%}</title>
    {%css%}

    <!-- ========================================================================
         SITE-LEVEL TAGS DASH DOES NOT EMIT — the only tags allowed here
         ======================================================================== -->
    <meta name="keywords" content="Dash, Plotly Dash, MUI X Charts, Python charts, LineChart, BarChart, CandlestickChart, PieChart, ScatterChart, CompositeChart, Heatmap, SparklineChart, TreeView, TimeClock, data visualization, React charts, Material UI">
    <meta name="author" content="Pip Install Python LLC">
    <meta property="og:site_name" content="dash-mui-charts — MUI X charts for Dash">
    <meta property="og:locale" content="en_US">

    <!-- OG URL: genuinely absent from Dash's per-page set. The origin is
         substituted from lib/constants.py at boot; the sync script below
         re-points it on SPA navigation. -->
    <meta property="og:url" content="__CANONICAL_ORIGIN__/">

    <!-- THE SOCIAL CARD — the image URL itself is NOT here, deliberately:
         every register_page passes image_url from lib/constants.OG_IMAGE_URL,
         so Dash emits the og:image and twitter:image tags per page. Only the
         auxiliaries Dash never emits remain. Keep them in step with
         lib/constants.OG_IMAGE_* — a declared size that disagrees with the
         real file is worse than none, because platforms reserve that box and
         crop into it. -->
    <meta property="og:image:secure_url" content="https://cdn.2plot.ai/github_assets/muicharts.2plot.dev.png">
    <meta property="og:image:type" content="image/png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="dash-mui-charts — MUI X charts for Dash">
    <meta name="twitter:image:alt" content="dash-mui-charts — MUI X charts for Dash">

    <!-- Keeps canonical / og:url / twitter:url correct across CLIENT-SIDE
         navigation only — dash-improve-my-llms emits all three server-side
         per route, but this app routes via the History API without firing a
         navigation event, which leaves those tags describing the page the
         visitor first landed on.

         UPDATE-ONLY, deliberately: it never creates a tag the server did not
         send (two canonicals is worse than a stale one — engines may ignore
         both). The origin is substituted from lib/constants.py, not read
         from location.origin, so hits on the *.onrender.com hostname
         consolidate onto the canonical domain instead of competing with it. -->
    <script>
    (function () {
        var CANONICAL_ORIGIN = '__CANONICAL_ORIGIN__';

        function update(selector, attr, value) {
            var el = document.head.querySelector(selector);
            if (el) { el.setAttribute(attr, value); }
        }

        function canonicalUrl() {
            var path = window.location.pathname || '/';
            if (path.length > 1 && path.charAt(path.length - 1) === '/') {
                path = path.slice(0, -1);
            }
            return CANONICAL_ORIGIN + path;
        }

        function sync() {
            var url = canonicalUrl();
            update('link[rel="canonical"]', 'href', url);
            update('meta[property="og:url"]', 'content', url);
            update('meta[property="twitter:url"]', 'content', url);
        }

        ['pushState', 'replaceState'].forEach(function (name) {
            var original = history[name];
            history[name] = function () {
                var result = original.apply(this, arguments);
                sync();
                return result;
            };
        });
        window.addEventListener('popstate', sync);

        sync();
    })();
    </script>

    <!-- ========================================================================
         FAVICON — randomly area-chart or bar-chart per load (brand quirk, kept)
         ======================================================================== -->
    <link id="favicon" rel="icon" type="image/x-icon" href="/assets/favicon_areachart.ico">
    <link id="apple-touch-icon" rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon_areachart.png">
    <script>
        (function() {
            var useBar = Math.random() < 0.5;
            var suffix = useBar ? 'barchart' : 'areachart';
            document.getElementById('favicon').href = '/assets/favicon_' + suffix + '.ico';
            document.getElementById('apple-touch-icon').href = '/assets/apple-touch-icon_' + suffix + '.png';
            // The header avatar is rendered by React after this runs. Retry
            // BOUNDED (5s worth) rather than forever: the unbounded loop this
            // replaces would spin for the whole session on any page where the
            // avatar never mounts.
            window.__dmuiIconSuffix = suffix;
            var attempts = 0;
            function syncAvatar() {
                var img = document.querySelector('#header-avatar img');
                if (img) {
                    img.src = '/assets/favicon_' + suffix + '.ico';
                } else if (attempts++ < 25) {
                    setTimeout(syncAvatar, 200);
                }
            }
            if (document.readyState === 'complete') {
                setTimeout(syncAvatar, 300);
            } else {
                window.addEventListener('load', function() { setTimeout(syncAvatar, 300); });
            }
        })();
    </script>

    <meta name="theme-color" content="#1976d2">

    <!-- Structured data. SoftwareSourceCode, not SoftwareApplication: this
         describes an open-source library you import. The version is
         substituted from the package at boot — this block carried a
         hardcoded "1.2.1" two releases after it stopped being true. -->
    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@graph": [
            {
                "@type": "SoftwareSourceCode",
                "name": "dash-mui-charts — MUI X charts for Dash",
                "description": "13 Plotly Dash components wrapping MUI X: LineChart, BarChart, CandlestickChart, PieChart, ScatterChart, CompositeChart, Heatmap, SparklineChart, LiveTradingChart, TreeView, SimpleTreeView, TreeViewPro and TimeClock.",
                "url": "__CANONICAL_ORIGIN__",
                "version": "__APP_VERSION__",
                "codeRepository": "https://github.com/pip-install-python/dash-mui-charts",
                "programmingLanguage": ["Python", "JavaScript"],
                "license": "https://opensource.org/licenses/MIT",
                "author": {
                    "@type": "Organization",
                    "name": "Pip Install Python LLC",
                    "url": "https://pip-install-python.com",
                    "sameAs": [
                        "https://github.com/pip-install-python",
                        "https://www.youtube.com/@PipInstallPython",
                        "https://pypi.org/user/pip-install-python/"
                    ]
                }
            },
            {
                "@type": "WebSite",
                "name": "dash-mui-charts — MUI X charts for Dash",
                "url": "__CANONICAL_ORIGIN__",
                "publisher": {
                    "@type": "Organization",
                    "name": "Pip Install Python LLC",
                    "url": "https://pip-install-python.com"
                }
            }
        ]
    }
    </script>

    <!-- LLM discovery -->
    <meta name="llms-txt" content="__CANONICAL_ORIGIN__/llms.txt">
    <meta name="llms-sitemap" content="__CANONICAL_ORIGIN__/sitemap.xml">

    <!-- Performance -->
    <link rel="preconnect" href="https://www.googletagmanager.com">

</head>
<body>
    {%app_entry%}

    <footer>
        {%config%}
        {%scripts%}
        {%renderer%}
    </footer>

            <p style="font-size: 1.125rem; color: #495057; margin-bottom: 2rem;"><strong>MUI X charts for Dash</strong> — v__APP_VERSION__, by Pip Install Python</p>

            <h2 style="font-size: 1.75rem; margin: 2rem 0 1rem;">13 Components</h2>
            <ul style="margin: 1rem 0; line-height: 2; font-size: 1rem;">
