services:
  - type: web
    name: dash-mui-charts
    runtime: python
    # Explicit, not inherited: the disk below and the always-on posture the
    # hub's hourly sweep expects both assume a paid instance.
    plan: starter
    repo: https://github.com/pip-install-python/dash-mui-charts
    branch: main
    # markdown2dash installs --no-deps: it pins gunicorn<22 against the
    # CVE-driven >=23 floor (LESSONS §8). Same pair as the Dockerfile and CI.
    buildCommand: pip install -r requirements.txt && pip install --no-deps markdown2dash==0.1.2 && pip install .
    startCommand: gunicorn run:server -b 0.0.0.0:$PORT --workers 2 --timeout 120
    # The canonical origin. The legacy dash-mui-charts.onrender.com hostname
    # keeps resolving after this is attached — lib/constants.BASE_URL and the
    # canonical tags all point here, so link equity consolidates on one host.
    domains:
      - muicharts.2plot.dev
    # LESSONS §10: blueprint envVars apply on BLUEPRINT SYNC, not on git-push
    # autodeploys. Everything below must ALSO be set on the service in the
    # Render dashboard, or a value added here does nothing until the next
    # manual sync. The declarations are the documentation of what this app
    # reads; the dashboard is what the running service actually gets.
    envVars:
      - key: MUI_PRO_API_KEY
        sync: false
      # Shared network secret — signs the hourly traffic rollup this app
      # POSTs to https://2plot.ai/api/satellite/traffic
      # (lib/satellite_reporter). Unset = reporting OFF, and the boot log
      # says so.
      - key: CROSS_APP_WEBHOOK_SECRET
        sync: false
      # This app's key in the hub's network directory — what the reporter,
      # hub_client and the bulletin all identify as. Also the code default,
      # declared so the identity is visible here.
      - key: SATELLITE_APP_KEY
        value: "muicharts"
      # The hub takes the LAST report for a given (app, date). On an
      # ephemeral filesystem a mid-day deploy wipes the ledger and the next
      # hourly report overwrites the day's real total with whatever accrued
      # since the restart. The disk below is what stops that.
      - key: TRAFFIC_ANALYTICS_FILE
        value: "/var/data/visitor_analytics.json"
      # Access tiers for the tiered corpus documents (/llms-small.txt,
      # /llms-full.txt — dash-improve-my-llms >= 2.4.0). Deliberately set to
      # the default so the knob is visible: the 402 experiment tightens the
      # full corpus by flipping this to `auth`, per satellite, with no code
      # change.
      - key: LLMS_SMALL_TIER
        value: "public"
      - key: LLMS_FULL_TIER
        value: "public"
      # Canonical origin override. The code default is already the value
      # below (lib/constants.DEFAULT_BASE_URL); declared so the service
      # documents its own identity and a fork cannot inherit this one's.
      - key: APP_BASE_URL
        value: "https://muicharts.2plot.dev"
      # This app's ONE short id on every hub surface (STANDARD §5). Also the
      # code default — declared for the same reason as APP_BASE_URL.
      - key: AD_APP_ID
        value: "muicharts"
      # The hub's announcement feed for the llms.txt viewer header. Opt-in:
      # lib/bulletin.py wires nothing without it. Detection of a missing
      # value: the viewer shows one generic tip where the hub publishes more.
      - key: NETWORK_BULLETIN_URL
        value: "https://2plot.dev/api/network/bulletin"
      - key: PYTHON_VERSION
        value: "3.11.12"
    # /healthz is the network liveness convention the hub's hourly sweep
    # polls; "/" would render the whole Dash index on every probe.
    healthCheckPath: /healthz
    autoDeploy: true
    # Persists the visitor ledger across deploys — see TRAFFIC_ANALYTICS_FILE.
    disk:
      name: analytics
      mountPath: /var/data
      sizeGB: 1
