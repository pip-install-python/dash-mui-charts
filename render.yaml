services:
  - type: web
    name: dash-mui-charts
    runtime: python
    # Explicit, not inherited: the disk below and the always-on posture the
    # hub's hourly sweep expects both assume a paid instance.
    plan: starter
    repo: https://github.com/pip-install-python/dash-mui-charts
    branch: main
    # markdown2dash installs --no-deps: it pins gunicorn<22 against the
    # CVE-driven >=23 floor (LESSONS §8). Same pair as the Dockerfile and CI.
    buildCommand: pip install -r requirements.txt && pip install --no-deps markdown2dash==0.1.2 && pip install .
    startCommand: gunicorn run:server -b 0.0.0.0:$PORT --workers 2 --timeout 120
    # The canonical origin. The legacy dash-mui-charts.onrender.com hostname
    # keeps resolving after this is attached — lib/constants.BASE_URL and the
    # canonical tags all point here, so link equity consolidates on one host.
    domains:
      - muicharts.2plot.dev
    # LESSONS §10: blueprint envVars apply on BLUEPRINT SYNC, not on git-push
    # autodeploys. Everything below must ALSO be set on the service in the
    # Render dashboard, or a value added here does nothing until the next
    # manual sync. The declarations are the documentation of what this app
    # reads; the dashboard is what the running service actually gets.
    envVars:
      - key: MUI_PRO_API_KEY
        sync: false
      # Shared network secret — signs the hourly traffic rollup this app
      # POSTs to https://2plot.ai/api/satellite/traffic
      # (lib/satellite_reporter). Unset = reporting OFF, and the boot log
      # says so.
      - key: CROSS_APP_WEBHOOK_SECRET
        sync: false
      # This app's key in the hub's network directory — what the reporter,
      # hub_client and the bulletin all identify as. Also the code default,
      # declared so the identity is visible here.
      - key: SATELLITE_APP_KEY
        value: "muicharts"
      # 15 minutes, not the code default of hourly: the fleet is on paid
      # instances now and the hub board reads near-real-time. The live
      # "active now" number rides the separate presence beacon
      # (SATELLITE_PRESENCE_INTERVAL_S, default 60s, 0 disables) — this knob
      # only paces the daily rollup.
      - key: SATELLITE_REPORT_INTERVAL_S
        value: "900"
      # The hub takes the LAST report for a given (app, date). On an
      # ephemeral filesystem a mid-day deploy wipes the ledger and the next
      # hourly report overwrites the day's real total with whatever accrued
      # since the restart. The disk below is what stops that.
      - key: TRAFFIC_ANALYTICS_FILE
        value: "/var/data/visitor_analytics.json"
      # Control-board overrides (/admin/control-board) persist here — on the
      # same disk, so toggles survive deploys. TWICE on the pilot host this
      # row rode render.yaml without reaching the live service (Blueprint env
      # applies only on a sync) and every toggle silently reset per deploy;
      # the boot now prints a [visibility] WARNING when the variable is
      # missing OR when /var/data is not actually a mounted disk. The absence
      # of that warning in a deploy log is the acceptance check.
      - key: PAGE_VISIBILITY_FILE
        value: "/var/data/page_visibility.json"

      # --- The interactive gate (lib/gate_layouts.py) ---------------------
      # THE per-host gate switch: flip to `auth` and every docs page whose
      # frontmatter doesn't pin a tier shows the sign-in card to anonymous
      # browsers. Rollback is flipping it back — env only, no code revert.
      # SHIPS DARK: `public` here is the whole point of the dark launch —
      # the verdict plumbing, the gate cards and /api/agent-key all go live
      # and change nothing a visitor sees, so the flip is measured against a
      # host already proven healthy. The funnel's front door (`/`) and the
      # corpus pseudo-paths are pinned public in run.py and never inherit it.
      - key: PAGE_DEFAULT_TIER
        value: public
      # The second axis, and the phase-4 agent flip: while "1", machine
      # surfaces (llms.txt family, crawler HTML, the prerender) stay open on
      # auth pages so the crawl-demand window keeps measuring. "0" gates
      # anonymous machine fetches too (keyed agents still pass). Do not flip
      # before the window closes — see kickoff/fleet/KICKOFF-fleet-check.md.
      - key: LLMS_PUBLIC_DEFAULT
        value: "1"

      # --- Clerk satellite auth (lib/auth.py) -----------------------------
      # All OPTIONAL: absent, the site runs fully public and admin surfaces
      # fail CLOSED (lib.auth.admin_access_open). Set the two secret keys to
      # turn auth on. Values below mirror leaflet.2plot.dev, the pilot host.
      - key: CLERK_SECRET_KEY
        sync: false
      - key: CLERK_PUBLISHABLE_KEY
        sync: false
      # The 2plot.ai PRIMARY on its production Clerk instance (Account
      # Portal + Frontend API custom domains — not *.accounts.dev).
      - key: CLERK_SIGN_IN_URL
        value: https://accounts.2plot.ai/sign-in
      - key: CLERK_SIGN_UP_URL
        value: https://accounts.2plot.ai/sign-up
      # Where the primary sends a satellite visitor AFTER sign-in. Unset,
      # an authenticated user is stranded on 2plot.ai, silently — they
      # signed in successfully and simply never came back.
      # A DESTINATION, not a flag: the value is concatenated as
      # `<value>?returnTo=<here>`, so `true` or a bare host resolves against
      # THIS site and the button 404s — worse than unset. lib/auth.py warns
      # at boot for both mistakes; the absence of those warnings is the
      # deploy acceptance check.
      - key: CLERK_SATELLITE_SIGN_IN_REDIRECT
        value: https://2plot.ai/onboarding
      # REQUIRED in satellite mode; a production custom-domain instance
      # cannot derive it from CLERK_SIGN_IN_URL.
      - key: CLERK_FRONTEND_API
        value: https://clerk.2plot.ai
      # The REGISTERED SATELLITE DOMAIN — deliberately NOT the host this app
      # is served on. Every *.2plot.dev docs host is an ALLOWED SUBDOMAIN of
      # the 2plot.dev satellite; clerk.muicharts.2plot.dev is NXDOMAIN and
      # setting it here hangs sign-in. Session cookies are scoped to
      # .2plot.dev, which is exactly what the allowlist enables.
      - key: CLERK_SATELLITE_DOMAIN
        value: 2plot.dev
      - key: CLERK_IS_SATELLITE
        value: "true"
      # Signs the session + __dca_identity cookies. Without it
      # dash-clerk-auth falls back to a PUBLIC dev default string. UNIQUE
      # per service — never copied between hosts.
      - key: SESSION_SECRET
        generateValue: true
      # Admin allowlist for admin-tier pages and /admin/control-board
      # (lib.auth.is_admin_user).
      - key: ADMIN_EMAILS
        sync: false
      # Access tiers for the tiered corpus documents (/llms-small.txt,
      # /llms-full.txt — dash-improve-my-llms >= 2.4.0). Deliberately set to
      # the default so the knob is visible: the 402 experiment tightens the
      # full corpus by flipping this to `auth`, per satellite, with no code
      # change.
      - key: LLMS_SMALL_TIER
        value: "public"
      - key: LLMS_FULL_TIER
        value: "public"
      # Canonical origin override. The code default is already the value
      # below (lib/constants.DEFAULT_BASE_URL); declared so the service
      # documents its own identity and a fork cannot inherit this one's.
      - key: APP_BASE_URL
        value: "https://muicharts.2plot.dev"
      # This app's ONE short id on every hub surface (STANDARD §5). Also the
      # code default — declared for the same reason as APP_BASE_URL.
      - key: AD_APP_ID
        value: "muicharts"
      # The hub's announcement feed for the llms.txt viewer header. Opt-in:
      # lib/bulletin.py wires nothing without it. Detection of a missing
      # value: the viewer shows one generic tip where the hub publishes more.
      - key: NETWORK_BULLETIN_URL
        value: "https://2plot.dev/api/network/bulletin"
      # THE INTERPRETER THAT SERVES PRODUCTION. `runtime: python` above
      # means Render's native runtime builds this service, reads this key
      # at build time and ignores the Dockerfile entirely — so this line,
      # not `FROM python:` , is what visitors run on. Full X.Y.Z is
      # Render's encoding, not a choice; the MINOR must equal the fleet
      # Python (SYNC-1.6.22-1.6.29 item 5), the patch is a human bump.
      # Moved 3.11.12 -> 3.14.7 on 2026-08-26, closing a gap where CI
      # certified the app on 3.14 while production ran 3.11.
      #
      # Blueprint env applies on a SYNC. If the dashboard's own
      # PYTHON_VERSION still says 3.11.12 after this lands, the battery's
      # python_matches_declared check goes red against /healthz — that red
      # is the detect firing, and the fix is the dashboard, not the check.
      - key: PYTHON_VERSION
        value: "3.14.7"
    # /healthz is the network liveness convention the hub's hourly sweep
    # polls; "/" would render the whole Dash index on every probe.
    healthCheckPath: /healthz
    autoDeploy: true
    # Persists the visitor ledger across deploys — see TRAFFIC_ANALYTICS_FILE.
    disk:
      name: analytics
      mountPath: /var/data
      sizeGB: 1
