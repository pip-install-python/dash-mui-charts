name: CD

# Deploys muicharts.2plot.dev, then checks the live site.
#
# THE ROAD (sync item 13, owner decision A of 2026-08-29): Render auto-deploys
# the `release` branch, and ONLY this workflow writes `release` — a
# fast-forward push of the run's own sha, after the CI matrix is green. A push
# to `main` is therefore not a deploy; it is a candidate. The measured reason
# on the template that day: 14:12Z de0bcff was pushed to main, Render (watching
# main) built it inside the minute, its CD run went red at 14:13Z with the
# deploy job skipped, and /healthz served the red build for ~6 minutes. CI
# cannot stop a deploy while the platform watches the branch CI is still
# judging. Now it watches a branch that only ever holds certified commits.
#
# The Render deploy-hook step is GONE from this file; the repository secret it
# read (the `…_DEPLOY_HOOK_URL` one) is inert and safe to delete — its name is
# deliberately not spelled here, because sync item 13's detect greps this file
# for it. `main` ahead of `release` means an uncertified push is pending (its
# run red or still running) — never "drift", never a reason to deploy by hand.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target_url:
        description: Site to verify (skips the deploy when set to another host)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: cd-production
  cancel-in-progress: false

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  SITE_URL: ${{ inputs.target_url || 'https://muicharts.2plot.dev' }}

jobs:
  test:
    name: ci
    uses: ./.github/workflows/ci.yml

  deploy:
    name: deploy to render
    needs: [test]
    runs-on: ubuntu-latest
    # Long enough for the wait loop below (up to 100 x 15s on the build path,
    # or a 120s settle plus 40 x 15s on the fallback) and no longer. Without
    # it the job inherits GitHub's six-hour default, which is how a platform
    # that never comes back healthy holds the `cd-production` concurrency
    # group all day. Sized for the WORST build, not the median: a floor bump
    # busts the dependency cache by design, so this pipeline's most important
    # deploy is also its slowest — dash-email's wait timed out on exactly that
    # build class (2026-08-23) with the old 60 x 15s window. Taken from the
    # template's 1.6.13 widening, which sat on this fork's recorded drift list
    # until the ledger round's floor bump made it the live risk.
    timeout-minutes: 30
    environment:
      name: production
      url: https://muicharts.2plot.dev
    # `contents: write` on THIS job only — it is the one thing in the
    # workflow that writes to the repository (the `release` ref). The
    # workflow-level grant above stays `read`.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # FULL history, not the default depth-1 shallow clone. A shallow
          # HEAD pushed onto an EXISTING `release` is rejected as
          # non-fast-forward ("fetch first") because the clone cannot show
          # the remote that release's tip is an ancestor. The template's
          # FIRST promote (ea4e104, 2026-08-29) succeeded only because
          # `release` did not exist yet; its second (747d8b3) failed in one
          # second. tests/test_cd_promotes_release.py pins this.
          fetch-depth: 0

      - name: Promote to release
        # Only a push to main promotes. A workflow_dispatch that names
        # another host (target_url) is a verify-only run against that host
        # and must not move this repo's release ref. The hook step this
        # replaced had no such guard.
        if: github.event_name == 'push' || inputs.target_url == ''
        run: |
          # Fast-forward push of the run's own sha. `needs: [test]` is the
          # gate: a red matrix never reaches this step, so `release` cannot
          # receive an uncertified commit by construction. On the FIRST run
          # `release` does not exist yet and this push creates it.
          #
          # NOT --force, on purpose: a non-fast-forward means somebody wrote
          # `release` by hand (a rollback, a hotfix). This job then FAILS and
          # says so; a force here would silently undo that person.
          #
          # GITHUB_TOKEN pushes trigger no workflows — correct: `on:` is
          # main-only, and it is Render, not Actions, that reacts to
          # `release` (render.yaml `branch: release`, autoDeploy on).
          git push origin "HEAD:refs/heads/release"
          echo "::notice::release → ${GITHUB_SHA} (fast-forward)"

      # Render deploys `release`, which the step above just set to this run's
      # sha, so the wait is unchanged: hold until /healthz reports THIS build.
      # The shape it replaced ran only when the deploy hook fired, which meant
      # a repo without that secret waited ZERO seconds and handed `verify` the
      # PREVIOUS release to grade — green for as long as no change added a
      # surface the battery probes, and the gate wave's /api/agent-key was
      # that change.
      - name: Wait for the new build to serve traffic
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          # Waiting on a STATUS CODE proves nothing: Render keeps the old
          # instance answering while the new one builds (LESSONS §16), and a
          # disk-backed service restarts with a blip instead of overlapping.
          # So wait on the ARTIFACT — /healthz reports the commit the running
          # instance was built from (lib/health.py, from RENDER_GIT_COMMIT).
          # The key is `build`: this repo shipped it as `commit` first, and
          # the template adopted the idea under the fleet's name, so it moved
          # here in the 2.7.1 floor round. The fallback below covers the one
          # deploy where the running build still answers the old name.
          live_build() {
            curl -fsS --max-time 20 "$SITE_URL/healthz" 2>/dev/null \
              | python3 -c 'import json,sys; print((json.load(sys.stdin) or {}).get("build") or "")' 2>/dev/null \
              || true
          }

          # The first deploy carrying this change is served by a build that
          # predates the `build` field, so there is nothing to match against;
          # fall back to the old sustained-health wait and say so. Every
          # deploy after it gets the exact check.
          if [ -z "$(live_build)" ]; then
            echo "::warning::/healthz reports no build field — the running build predates it. Falling back to sustained-health waiting, which cannot tell the new build from the old one."
            sleep 120
            ok=0
            for _ in $(seq 1 40); do
              if curl -fsS "$SITE_URL/healthz" > /dev/null; then
                ok=$((ok + 1))
                [ "$ok" -ge 5 ] && break
              else
                ok=0
              fi
              sleep 15
            done
            if [ "$ok" -lt 5 ]; then
              echo "::error::$SITE_URL never became reliably healthy"
              exit 1
            fi
            exit 0
          fi

          echo "waiting for $SITE_URL to serve build $EXPECTED_SHA"
          for i in $(seq 1 100); do
            live=$(live_build)
            if [ "$live" = "$EXPECTED_SHA" ]; then
              echo "live after ~$((i * 15))s"
              exit 0
            fi
            echo "  [$i/100] serving ${live:-<unreachable>}"
            sleep 15
          done
          echo "::error::$SITE_URL never reported build $EXPECTED_SHA — the build failed, or the platform is still rolling it out. Nothing was verified against the new artifact."
          exit 1

  verify:
    name: verify the live site
    needs: [deploy]
    # ONLY after a successful deploy (sync item 13 (a2), ops finding on the
    # template's run 33262495272). This repo's own divergence — refusing to
    # verify a SKIPPED deploy, since the gate wave's first CD run graded the
    # previous release against the new checkout's battery — is SUBSUMED and
    # retired here: skipped is not success, and neither is failure. The half
    # this fork did not have: `!= 'cancelled' && != 'skipped'` still admitted
    # 'failure', so a failed promote let this job run and report GREEN against
    # the PREVIOUS build. A verify that passes when nothing deployed must not
    # exist.
    if: needs.deploy.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: The live build IS this run's sha
        # Belt to the `if:` above's braces, and stronger: it also catches a
        # promote that succeeded while Render's build did not, or a later run
        # that promoted past us between deploy and verify. Skipped on a
        # workflow_dispatch against another host (its shas are not ours).
        if: github.event_name == 'push' || inputs.target_url == ''
        run: |
          build="$(curl -fsS "$SITE_URL/healthz" | python3 -c 'import sys,json;print(json.load(sys.stdin).get("build",""))')"
          if [ "$build" != "$GITHUB_SHA" ]; then
            echo "::error::verify refuses: $SITE_URL serves build '${build:-<none>}', this run is $GITHUB_SHA — nothing this run shipped is on the wire to verify"
            exit 1
          fi
          echo "::notice::verifying build $build (this run's sha)"

      # The network battery first: it is the same script, with the same
      # check names, that CI ran against the container this deploy shipped.
      # A name that passed in CI and fails here isolates the fault to the
      # deploy.
      - name: Network smoke battery
        run: python scripts/network_smoke.py --base-url "$SITE_URL"

      # Then the satellite-specific checks the battery does not make: every
      # canonical, every crawler body, the social card's real pixels, and
      # every peer llms.txt in the directory actually resolving (peers WARN,
      # this host FAILS — LESSONS §17).
      - name: Smoke-test the deployment
        run: python scripts/smoke_live.py "$SITE_URL"

      - name: Report
        if: failure()
        run: |
          echo "::error::Live verification failed for $SITE_URL. Every failure these check for is silent in production: a site identity that fell back to a framework default, a stale dash-improve-my-llms artifact, a canonical on the wrong host, a page serving the JavaScript stub, a blank or reshaped social card, a missing network directory, and dead peer llms.txt links."
