name: CD

# Deploys muicharts.2plot.dev, then checks the live site.
#
# The deploy step POSTs to a Render deploy hook held in the
# RENDER_DEPLOY_HOOK_URL secret. Without that secret the step is skipped and
# the workflow goes straight to verification — the right behaviour here,
# because render.yaml sets `autoDeploy: true` and Render is already deploying
# from GitHub on its own. The hook only makes the timing explicit so the wait
# loop below knows what it is waiting for.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target_url:
        description: Site to verify (skips the deploy when set to another host)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: cd-production
  cancel-in-progress: false

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  SITE_URL: ${{ inputs.target_url || 'https://muicharts.2plot.dev' }}

jobs:
  test:
    name: ci
    uses: ./.github/workflows/ci.yml

  deploy:
    name: deploy to render
    needs: [test]
    runs-on: ubuntu-latest
    # Long enough for the wait loop below (up to 60 x 15s on the build path,
    # or a 120s settle plus 40 x 15s on the fallback) and no longer. Without
    # it the job inherits GitHub's six-hour default, which is how a platform
    # that never comes back healthy holds the `cd-production` concurrency
    # group all day.
    timeout-minutes: 25
    environment:
      name: production
      url: https://muicharts.2plot.dev
    outputs:
      deployed: ${{ steps.hook.outputs.deployed }}
    steps:
      - name: Trigger the Render deploy hook
        id: hook
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::notice::RENDER_DEPLOY_HOOK_URL is not set — this push deploys through render.yaml's autoDeploy instead. The wait below still holds until the new build is live, so verification is unaffected."
            echo "deployed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          curl -fsS -X POST "$HOOK" > /dev/null
          echo "deployed=true" >> "$GITHUB_OUTPUT"

      # DELIBERATELY not gated on the hook. render.yaml sets
      # `autoDeploy: true`, so a push to main deploys with or without
      # RENDER_DEPLOY_HOOK_URL — but this step used to run only when the
      # hook fired, which meant a repo without that secret waited ZERO
      # seconds and handed `verify` the PREVIOUS release to grade. It looked
      # green for as long as no change added a surface the battery probes;
      # the gate wave added /api/agent-key and the deploy "succeeded" while
      # verification failed against a build that did not have the route yet.
      - name: Wait for the new build to serve traffic
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          # Waiting on a STATUS CODE proves nothing: Render keeps the old
          # instance answering while the new one builds (LESSONS §16), and a
          # disk-backed service restarts with a blip instead of overlapping.
          # So wait on the ARTIFACT — /healthz reports the commit the running
          # instance was built from (lib/health.py, from RENDER_GIT_COMMIT).
          # The key is `build`: this repo shipped it as `commit` first, and
          # the template adopted the idea under the fleet's name, so it moved
          # here in the 2.7.1 floor round. The fallback below covers the one
          # deploy where the running build still answers the old name.
          live_build() {
            curl -fsS --max-time 20 "$SITE_URL/healthz" 2>/dev/null \
              | python3 -c 'import json,sys; print((json.load(sys.stdin) or {}).get("build") or "")' 2>/dev/null \
              || true
          }

          # The first deploy carrying this change is served by a build that
          # predates the `build` field, so there is nothing to match against;
          # fall back to the old sustained-health wait and say so. Every
          # deploy after it gets the exact check.
          if [ -z "$(live_build)" ]; then
            echo "::warning::/healthz reports no build field — the running build predates it. Falling back to sustained-health waiting, which cannot tell the new build from the old one."
            sleep 120
            ok=0
            for _ in $(seq 1 40); do
              if curl -fsS "$SITE_URL/healthz" > /dev/null; then
                ok=$((ok + 1))
                [ "$ok" -ge 5 ] && break
              else
                ok=0
              fi
              sleep 15
            done
            if [ "$ok" -lt 5 ]; then
              echo "::error::$SITE_URL never became reliably healthy"
              exit 1
            fi
            exit 0
          fi

          echo "waiting for $SITE_URL to serve build $EXPECTED_SHA"
          for i in $(seq 1 60); do
            live=$(live_build)
            if [ "$live" = "$EXPECTED_SHA" ]; then
              echo "live after ~$((i * 15))s"
              exit 0
            fi
            echo "  [$i/60] serving ${live:-<unreachable>}"
            sleep 15
          done
          echo "::error::$SITE_URL never reported build $EXPECTED_SHA — the build failed, or the platform is still rolling it out. Nothing was verified against the new artifact."
          exit 1

  verify:
    name: verify the live site
    needs: [deploy]
    # `always()` so a deploy that FAILED still gets its live site checked —
    # a partially-applied deploy is exactly when you want the battery. But
    # NOT when deploy was SKIPPED: that means CI rejected the commit and
    # nothing shipped, so this job would grade the previous release against
    # the new checkout's battery. That is not a hypothetical — the gate
    # wave's first CD run failed CI, deploy skipped, and this job then
    # reported "Live verification failed" because production had not yet
    # been given the /api/agent-key route the new battery probes for. Two
    # red jobs, one real cause, and the loud one was the wrong one.
    if: always() && needs.deploy.result != 'cancelled' && needs.deploy.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      # The network battery first: it is the same script, with the same
      # check names, that CI ran against the container this deploy shipped.
      # A name that passed in CI and fails here isolates the fault to the
      # deploy.
      - name: Network smoke battery
        run: python scripts/network_smoke.py --base-url "$SITE_URL"

      # Then the satellite-specific checks the battery does not make: every
      # canonical, every crawler body, the social card's real pixels, and
      # every peer llms.txt in the directory actually resolving (peers WARN,
      # this host FAILS — LESSONS §17).
      - name: Smoke-test the deployment
        run: python scripts/smoke_live.py "$SITE_URL"

      - name: Report
        if: failure()
        run: |
          echo "::error::Live verification failed for $SITE_URL. Every failure these check for is silent in production: a site identity that fell back to a framework default, a stale dash-improve-my-llms artifact, a canonical on the wrong host, a page serving the JavaScript stub, a blank or reshaped social card, a missing network directory, and dead peer llms.txt links."
